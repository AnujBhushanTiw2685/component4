name: Release Pipeline

on: 
    workflow_dispatch:

        release:
            types:
                - published

env:
    COMPONENT_NAME: component4

jobs:
    build:
        name: Build
        runs-on: ubuntu-latest

        outputs:
            artifact-name: ${{ steps.artifact.outputs.name }}

        steps:
            - name: Checkout Repository
              run: |
                echo "Building $COMPONENT_NAME..."
                sleep 5
                mkdir -p build
                echo "Dummy artifact for $COMPONENT_NAME" > build/artifact.txt

            - name: Set Artifact Name
              id: artifact
              run: |
                echo "name=${COMPONENT_NAME}-artifact" >> "$GITHUB_OUTPUT"

        
    unit_test:
        name: Unit Test
        runs-on: ubuntu-latest
        needs: build


        steps:
            - name: Execute Unit Tests
              run: |
                echo "Running unit tests..."
                sleep 3

    integration_test:
        name: Integration Test
        runs-on : ubuntu-latest
        needs: unit_test
        
        steps:
            - name: Execute Integration Test
              run: |
                echo "Running integration tests..."
                sleep 3

    security_scan:
        name: Security Scan
        runs-on: ubuntu-latest
        needs: integration_test


        steps:
            - name: Execute Security Scan
              run: |
                echo "Running Security Scan"
                sleep 3

    package:
        name: Package
        runs-on: ubuntu-latest
        needs: security_scan

        steps:
            - name: Package Release
              run: |
                echo "Packaging release..."
                sleep 3

    deploy:
        name: Deploy
        runs-on: ubuntu-latest
        needs: package

        steps:
            - name: Simulate Deployment
              run: |
                echo "Deploying $COMPONENT_NAME..."
                sleep 3

